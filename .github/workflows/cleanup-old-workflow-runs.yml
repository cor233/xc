name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete workflow runs
        uses: iamazeem/delete-workflow-runs-action@v1
        with:
          keep: 1              # 保留最新 1 条（即本次运行）
          status: completed
