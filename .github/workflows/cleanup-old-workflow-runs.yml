name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:

jobs:
  clean-up:
    name: clean up
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 清理历史记录
        uses: iamazeem/delete-workflow-runs-action@v1
        with:
          keep: 1
          status: completed
