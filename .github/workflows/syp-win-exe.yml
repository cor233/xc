name: Build SYP EXE（Windows）

on:
  workflow_dispatch:
  push:
    paths:
      - 'syp/**'

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Publish
      run: dotnet publish syp/syp.csproj -c Release -r win-x64 -p:PublishSingleFile=true --self-contained true -o ./publish-syp
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: syp-exe
        path: ./publish-syp/syp.exe
