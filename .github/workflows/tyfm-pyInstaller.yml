name: Build TYFM EXE (PyInstaller)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests

      - name: 使用 PyInstaller 打包
        run: |
          pyinstaller --onedir --noupx --windowed --icon "tyfm/icon.ico" --name "tyfm" tyfm/tyfm.py

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tyfm-pyinstaller
          path: dist/tyfm/
