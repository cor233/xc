name: Build TYFM EXE（Windows Green）

on:
  workflow_dispatch:
  push:
    paths:
      - 'tyfm/**'

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 .NET 环境
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: 编译发布项目
      run: dotnet publish tyfm/tyfm.csproj -c Release -r win-x64 --self-contained true -o ./publish-tyfm
      
    - name: 打包为 ZIP 压缩文件
      run: Compress-Archive -Path ./publish-tyfm/* -DestinationPath ./tyfm.zip
      
    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: tyfm
        path: ./tyfm.zip
