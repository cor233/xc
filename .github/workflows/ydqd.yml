name: 移动云盘自动签到

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ydqd-signin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ydqd
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ydqd/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 绑定 hosts 解析
        run: |
          echo "112.33.111.196 orches.yun.139.com" | sudo tee -a /etc/hosts
          echo "REAL_IP_CAIYUN caiyun.feixin.10086.cn" | sudo tee -a /etc/hosts
          echo "REAL_IP_SLW slw.h5cmpassport.com" | sudo tee -a /etc/hosts
          echo "REAL_IP_MCLOUD m.mcloud.139.com" | sudo tee -a /etc/hosts
          echo "REAL_IP_KD personal-kd-njs.yun.139.com" | sudo tee -a /etc/hosts
          echo "REAL_IP_AI ai.yun.139.com" | sudo tee -a /etc/hosts
          echo "REAL_IP_USER user-njs.yun.139.com" | sudo tee -a /etc/hosts
          echo "REAL_IP_YUN yun.139.com" | sudo tee -a /etc/hosts
          cat /etc/hosts

      - name: 恢复缓存
        uses: actions/cache@v4
        with:
          path: |
            ydqd/yunpan_device_ids.json
            ydqd/data/yunpan_token_cache.json
          key: caiyun-cache-${{ github.run_id }}
          restore-keys: |
            caiyun-cache-

      - name: 执行签到
        env:
          yunpan: ${{ secrets.YUNPAN_TOKEN }}
          yunpan_device_id: ${{ secrets.YUNPAN_DEVICE_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python yunpan.py
