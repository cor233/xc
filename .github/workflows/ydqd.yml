name: 移动云盘自动签到

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ydqd-signin
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ydqd
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ydqd/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 绑定 hosts
        run: |
          echo "112.33.111.196 orches.yun.139.com" | sudo tee -a /etc/hosts
          echo "36.138.55.14 caiyun.feixin.10086.cn" | sudo tee -a /etc/hosts
          cat /etc/hosts
          getent hosts orches.yun.139.com || echo "orches 解析失败"
          getent hosts caiyun.feixin.10086.cn || echo "caiyun 解析失败"

      - name: 执行签到
        env:
          yunpan: ${{ secrets.YUNPAN_TOKEN }}
          yunpan_device_id: ${{ secrets.YUNPAN_DEVICE_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python yunpan.py

      - name: 诊断 caiyun 接口
        run: |
          echo "===== POST tyrzLogin ====="
          curl -s -o /tmp/resp.txt -w "HTTP_CODE:%{http_code}\n" \
            -X POST --max-time 15 \
            "https://caiyun.feixin.10086.cn:7071/portal/auth/tyrzLogin.action?ssoToken=test" \
            -H "User-Agent: Mozilla/5.0" -H "Accept: */*"
          echo "----- body -----"
          head -c 500 /tmp/resp.txt
