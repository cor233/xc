name: 移动云盘自动签到

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ydqd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: pip3 install requests pycryptodome

      - name: 执行签到
        env:
          yunpan: ${{ secrets.YUNPAN_TOKEN }}
          yunpan_device_id: ${{ secrets.YUNPAN_DEVICE_ID }}
          yunpan_skip: ${{ secrets.yunpan_skip }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python yunpan.py
