name: 移动云盘自动签到

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ydqd-signin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ydqd
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ydqd/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 设置公共DNS
        run: |
          sudo rm -f /etc/resolv.conf
          echo "nameserver 223.5.5.5" | sudo tee /etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf
          echo "options timeout:2 attempts:3" | sudo tee -a /etc/resolv.conf
          sudo systemctl disable --now systemd-resolved || true
          echo "DNS 设置完成，当前 resolv.conf 内容:"
          cat /etc/resolv.conf
          echo "正在验证 orches.yun.139.com 解析..."
          getent hosts orches.yun.139.com || echo "解析失败，但脚本会继续尝试"

      - name: 恢复缓存
        uses: actions/cache@v4
        with:
          path: |
            ydqd/yunpan_device_ids.json
            ydqd/data/yunpan_token_cache.json
          key: caiyun-cache-${{ github.run_id }}
          restore-keys: |
            caiyun-cache-

      - name: 执行签到
        env:
          yunpan: ${{ secrets.YUNPAN_TOKEN }}
          yunpan_device_id: ${{ secrets.YUNPAN_DEVICE_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python yunpan.py
